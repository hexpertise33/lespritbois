<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img"
     aria-labelledby="titre desc">
  <title id="titre">En ville, ce qui commande un ouvrage extérieur : la limite séparative et l'accès</title>
  <desc id="desc">À gauche, une parcelle urbaine vue en plan : l'ouvrage touche presque toujours
    une limite séparative, ce qui met en jeu le recul imposé et la hauteur admissible en limite,
    lus au règlement de zone du PLU. À droite, l'accès au chantier : un portail étroit impose
    d'adapter la longueur des pièces préparées en atelier.</desc>

  <style>
    .fond   { fill: #faf7f2; }
    .terrain{ fill: #eae4da; }
    .maison { fill: #b9b1a6; }
    .ouvrage{ fill: #c67c3d; }
    .limite { stroke: #1f1c19; stroke-width: 2.5; fill: none; }
    .cote   { stroke: #9a5a24; stroke-width: 1.5; fill: none; }
    .fin    { stroke: #5b5651; stroke-width: 1.5; fill: none; }
    .titre  { font: 600 19px Georgia, serif; fill: #1f1c19; }
    .txt    { font: 14px system-ui, -apple-system, sans-serif; fill: #5b5651; }
    .lbl    { font: 600 13px system-ui, -apple-system, sans-serif; fill: #9a5a24; }
  </style>

  <rect class="fond" width="960" height="460"/>

  <!-- ================= GAUCHE : la limite, vue en plan ================= -->
  <text class="titre" x="40" y="42">La limite séparative</text>
  <text class="txt"   x="40" y="66">En tissu dense, l'ouvrage la touche presque</text>
  <text class="txt"   x="40" y="86">toujours.</text>

  <rect class="terrain" x="40" y="110" width="400" height="230"/>
  <g class="limite">
    <path d="M40 110 h400 v230 h-400 z"/>
  </g>
  <text class="lbl" x="52" y="130">limite de parcelle</text>

  <rect class="maison"  x="60"  y="220" width="180" height="110"/>
  <text class="txt" x="96" y="282">maison</text>

  <rect class="ouvrage" x="270" y="160" width="140" height="90"/>
  <text class="txt" x="288" y="212">carport</text>

  <!-- cote de recul entre l'ouvrage et la limite -->
  <g class="cote">
    <path d="M410 205 h30"/>
    <path d="M416 199 l-6 6 6 6"/><path d="M434 199 l6 6 -6 6"/>
  </g>
  <text class="lbl" x="330" y="146">recul imposé</text>

  <text class="txt" x="40" y="378">Recul, hauteur admissible en limite et vue sur</text>
  <text class="txt" x="40" y="398">le fonds voisin se lisent au règlement de zone</text>
  <text class="txt" x="40" y="418">du PLU, avant de dessiner.</text>

  <line class="fin" x1="480" y1="30" x2="480" y2="440" stroke-dasharray="6 6"/>

  <!-- ================= DROITE : l'accès ================= -->
  <text class="titre" x="520" y="42">L'accès</text>
  <text class="txt"   x="520" y="66">Une charpente préparée en atelier arrive en</text>
  <text class="txt"   x="520" y="86">éléments. Encore faut-il les livrer.</text>

  <!-- mur de rue avec portail étroit -->
  <rect class="maison" x="520" y="140" width="120" height="26"/>
  <rect class="maison" x="712" y="140" width="208" height="26"/>
  <text class="lbl" x="606" y="132">portail 90 cm</text>
  <g class="cote">
    <path d="M640 178 h72"/>
    <path d="M646 172 l-6 6 6 6"/><path d="M706 172 l6 6 -6 6"/>
  </g>

  <!-- pièce trop longue, refusée -->
  <rect class="ouvrage" x="560" y="228" width="330" height="16"/>
  <g class="limite">
    <path d="M700 208 l40 56 M740 208 l-40 56"/>
  </g>
  <text class="txt" x="520" y="204">pièce d'un seul tenant : ne passe pas</text>

  <!-- pièces adaptées, en deux longueurs -->
  <rect class="ouvrage" x="560" y="308" width="150" height="16"/>
  <rect class="ouvrage" x="724" y="308" width="150" height="16"/>
  <text class="txt" x="520" y="292">longueurs adaptées au relevé : elles passent</text>

  <text class="txt" x="520" y="378">Rue étroite, portail de 90 cm, passage par la</text>
  <text class="txt" x="520" y="398">maison : cela se règle au relevé, pas le jour</text>
  <text class="txt" x="520" y="418">de la pose.</text>
</svg>
