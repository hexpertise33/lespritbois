<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img"
     aria-labelledby="titre desc">
  <title id="titre">Ce qui dimensionne une pergola au vent : l'ancrage, pas la lame</title>
  <desc id="desc">Le vent qui s'appuie sur les lames orientables crée un soulèvement et un
    basculement. L'effort ne s'arrête pas à la lame : il descend par les poteaux jusqu'aux massifs.
    C'est le massif et la section du poteau qui décident, pas le modèle de lame.</desc>

  <style>
    .fond   { fill: #faf7f2; }
    .sol    { fill: #eae4da; }
    .massif { fill: #b9b1a6; }
    .alu    { fill: #5b5651; }
    .lame   { fill: #c67c3d; }
    .effort { stroke: #9a5a24; stroke-width: 2.5; fill: none; }
    .vent   { stroke: #9a5a24; stroke-width: 2.5; fill: none; }
    .titre  { font: 600 19px Georgia, serif; fill: #1f1c19; }
    .txt    { font: 14px system-ui, -apple-system, sans-serif; fill: #5b5651; }
    .lbl    { font: 600 13px system-ui, -apple-system, sans-serif; fill: #9a5a24; }
  </style>

  <rect class="fond" width="960" height="460"/>

  <text class="titre" x="40" y="40">L'effort ne s'arrête pas à la lame</text>
  <text class="txt"   x="40" y="64">Une pergola bioclimatique n'est pas une toiture : c'est une surface qui prend au vent.</text>

  <!-- sol -->
  <rect class="sol" x="40" y="360" width="880" height="46"/>

  <!-- vent : entrées maritimes, depuis la gauche -->
  <g class="vent">
    <path d="M56 176 h130"/><path d="M172 169 l16 7 -16 7"/>
    <path d="M56 212 h104"/><path d="M146 205 l16 7 -16 7"/>
    <path d="M56 248 h130"/><path d="M172 241 l16 7 -16 7"/>
  </g>
  <text class="lbl" x="56" y="158">entrées maritimes</text>

  <!-- lames orientables, avec un intervalle laissé libre pour la flèche -->
  <g class="lame">
    <rect x="330" y="120" width="62" height="11" transform="rotate(-24 361 125)"/>
    <rect x="408" y="120" width="62" height="11" transform="rotate(-24 439 125)"/>
    <rect x="596" y="120" width="62" height="11" transform="rotate(-24 627 125)"/>
    <rect x="674" y="120" width="62" height="11" transform="rotate(-24 705 125)"/>
  </g>
  <text class="lbl" x="330" y="96">lames orientables : plus de prise au vent, pas moins</text>

  <!-- soulèvement, dans l'intervalle libre entre les lames -->
  <g class="effort">
    <path d="M508 168 v-40"/><path d="M500 138 l8 -12 8 12"/>
  </g>
  <text class="lbl" x="490" y="118">soulèvement</text>

  <!-- structure : traverse + deux poteaux -->
  <rect class="alu" x="300" y="170" width="420" height="16"/>
  <rect class="alu" x="300" y="186" width="18"  height="174"/>
  <rect class="alu" x="702" y="186" width="18"  height="174"/>

  <!-- descente d'effort, dessinée à côté des poteaux et non dedans -->
  <g class="effort">
    <path d="M286 206 v126"/><path d="M278 322 l8 12 8 -12"/>
    <path d="M734 206 v126"/><path d="M726 322 l8 12 8 -12"/>
  </g>
  <text class="lbl" x="336" y="262">l'effort descend</text>
  <text class="lbl" x="336" y="282">par le poteau</text>

  <!-- massifs -->
  <rect class="massif" x="276" y="360" width="66" height="46"/>
  <rect class="massif" x="678" y="360" width="66" height="46"/>
  <text class="lbl" x="358" y="390">massif</text>
  <text class="lbl" x="760" y="390">massif</text>

  <text class="txt" x="40" y="440">Ce sont la section du poteau et le massif qui décident du dimensionnement, pas le modèle de lame.</text>
</svg>
