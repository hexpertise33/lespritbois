<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img"
     aria-labelledby="titre desc">
  <title id="titre">Raccorder une extension à ossature bois sur un mur en pierre</title>
  <desc id="desc">À gauche, l'extension est accolée au mur existant : le joint entre les deux
    systèmes constructifs laisse un pont thermique sur toute la hauteur, avec la condensation qui
    l'accompagne. À droite, l'isolation par l'extérieur referme l'enveloppe neuve sur l'existant et
    la coupure disparaît.</desc>

  <style>
    .fond   { fill: #faf7f2; }
    .pierre { fill: #b9b1a6; }
    .ossa   { fill: #c67c3d; }
    .isol   { fill: #e3ac77; }
    .bard   { fill: #9a5a24; }
    .froid  { stroke: #1f1c19; stroke-width: 3; fill: none; }
    .fin    { stroke: #5b5651; stroke-width: 1.5; fill: none; }
    .titre  { font: 600 19px Georgia, serif; fill: #1f1c19; }
    .txt    { font: 14px system-ui, -apple-system, sans-serif; fill: #5b5651; }
    .lbl    { font: 600 13px system-ui, -apple-system, sans-serif; fill: #9a5a24; }
    .alerte { font: 600 13px system-ui, -apple-system, sans-serif; fill: #1f1c19; }
  </style>

  <rect class="fond" width="960" height="460"/>

  <text class="titre" x="40" y="40">Vue en plan, au droit du raccord</text>
  <text class="txt"   x="40" y="64">Le point dur d'une extension n'est pas l'ossature neuve, c'est sa jonction avec l'existant.</text>

  <!-- ================= GAUCHE : extension accolée ================= -->
  <text class="lbl" x="40" y="110">EXTENSION ACCOLÉE</text>

  <rect class="pierre" x="40"  y="132" width="150" height="150"/>
  <rect class="ossa"   x="206" y="132" width="26"  height="150"/>
  <rect class="isol"   x="232" y="132" width="120" height="150"/>
  <rect class="bard"   x="352" y="132" width="18"  height="150"/>

  <text class="txt" x="58"  y="200">mur en</text>
  <text class="txt" x="58"  y="220">pierre</text>
  <text class="txt" x="248" y="200">isolant</text>
  <text class="txt" x="248" y="220">de l'extension</text>

  <!-- le joint : coupure verticale franche entre les deux systèmes -->
  <g class="froid"><path d="M198 124 v166"/></g>
  <text class="alerte" x="40" y="322">Le joint reste ouvert sur toute la hauteur.</text>
  <text class="alerte" x="40" y="342">C'est là que la condensation s'installe.</text>

  <text class="txt" x="40" y="400">L'isolant s'arrête au nu du mur ancien.</text>
  <text class="txt" x="40" y="420">La coupure produit un pont thermique.</text>

  <line class="fin" x1="480" y1="96" x2="480" y2="440" stroke-dasharray="6 6"/>

  <!-- ================= DROITE : isolation par l'extérieur ================= -->
  <text class="lbl" x="520" y="110">ISOLATION PAR L'EXTÉRIEUR</text>

  <rect class="pierre" x="520" y="132" width="150" height="120"/>
  <rect class="ossa"   x="686" y="132" width="26"  height="120"/>
  <rect class="isol"   x="712" y="132" width="120" height="120"/>

  <text class="txt" x="538" y="182">mur en</text>
  <text class="txt" x="538" y="202">pierre</text>
  <text class="txt" x="728" y="182">isolant</text>
  <text class="txt" x="728" y="202">de l'extension</text>

  <!-- l'enveloppe continue court devant les deux, sans interruption -->
  <rect class="isol" x="520" y="252" width="312" height="30"/>
  <rect class="bard" x="520" y="282" width="312" height="18"/>
  <text class="lbl" x="520" y="322">Une seule enveloppe court devant la pierre</text>
  <text class="lbl" x="520" y="342">et devant l'ossature, sans interruption.</text>

  <text class="txt" x="520" y="400">L'enveloppe neuve se referme sur l'existant</text>
  <text class="txt" x="520" y="420">au lieu de s'y accoler. Plus de coupure.</text>
</svg>
